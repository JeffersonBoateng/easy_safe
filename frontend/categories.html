<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c7a4b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>EasySafe - Categories</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">EasySafe</div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="accounts.html" class="nav-item">Accounts</a>
        <a href="categories.html" class="nav-item active">Categories</a>
        <a href="transactions.html" class="nav-item">Transactions</a>
      </nav>

      <button id="logout-btn" class="sidebar-logout">Logout</button>
    </aside>

    <div class="main-content">
      <header class="content-topbar">
        <h2 id="welcome-msg"></h2>
      </header>

      <section class="categories-section">
        <div class="section-header">
          <h3>Categories</h3>
          <button id="toggle-add-category" class="small-btn">+ Add Category</button>
        </div>

        <form id="category-form" class="tx-form hidden">
          <input type="text" id="cat-name" placeholder="Category name (e.g. Food, Salary)" required>
          <select id="cat-type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <button type="submit">Save Category</button>
        </form>

        <ul id="category-list" class="category-list"></ul>
      </section>

      <footer class="site-footer">© 2026 EasySafe</footer>
    </div>
  </div>

  <script src="categories.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
