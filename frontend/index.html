<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasySafe - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">EasySafe</div>

      <nav class="sidebar-nav">
        <a href="#top" class="nav-item active">Dashboard</a>
        <a href="#accounts-section" class="nav-item">Accounts</a>
        <a href="#categories-section" class="nav-item">Categories</a>
        <a href="#transactions-section" class="nav-item">Transactions</a>
      </nav>

      <button id="logout-btn" class="sidebar-logout">Logout</button>
    </aside>

    <div class="main-content">
      <header class="content-topbar" id="top">
        <h2 id="welcome-msg"></h2>
      </header>

      <section class="balance-card">
        <p class="label">Total Balance</p>
        <div class="balance-row">
          <h2 id="total-balance">GHS 0.00</h2>
          <button id="toggle-balance" aria-label="Toggle balance visibility">👁️</button>
        </div>
      </section>

      <section class="accounts-section" id="accounts-section">
        <div class="section-header">
          <h3>Accounts</h3>
          <button id="toggle-add-account" class="small-btn">+ Add Account</button>
        </div>

        <form id="account-form" class="tx-form hidden">
          <input type="text" id="acc-name" placeholder="Account name (e.g. Savings)" required>
          <select id="acc-type" required>
            <option value="savings">Savings</option>
            <option value="checking">Checking</option>
          </select>
          <input type="number" id="acc-balance" placeholder="Starting balance" step="0.01">
          <button type="submit">Save Account</button>
        </form>

        <ul id="account-list" class="account-list"></ul>
      </section>

      <section class="categories-section" id="categories-section">
        <div class="section-header">
          <h3>Categories</h3>
          <button id="toggle-add-category" class="small-btn">+ Add Category</button>
        </div>

        <form id="category-form" class="tx-form hidden">
          <input type="text" id="cat-name" placeholder="Category name (e.g. Food, Salary)" required>
          <select id="cat-type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <button type="submit">Save Category</button>
        </form>

        <ul id="category-list" class="category-list"></ul>
      </section>

      <section class="transactions-section" id="transactions-section">
        <div class="section-header">
          <h3>Recent Transactions</h3>
          <button id="toggle-add-tx" class="small-btn">+ Add Transaction</button>
        </div>

        <form id="transaction-form" class="tx-form hidden">
          <select id="tx-account-id" required></select>
          <select id="tx-category-id" required></select>
          <input type="number" id="tx-amount" placeholder="Amount" step="0.01" required>
          <select id="tx-type" required>
            <option value="deposit">Deposit</option>
            <option value="withdrawal">Withdrawal</option>
          </select>
          <button type="submit">Save</button>
        </form>

        <ul id="transaction-list" class="transaction-list"></ul>
      </section>

      <footer class="site-footer">© 2026 EasySafe</footer>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
