<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c7a4b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>EasySafe - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">EasySafe</div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active">Dashboard</a>
        <a href="accounts.html" class="nav-item">Accounts</a>
        <a href="categories.html" class="nav-item">Categories</a>
        <a href="transactions.html" class="nav-item">Transactions</a>
      </nav>

      <button id="logout-btn" class="sidebar-logout">Logout</button>
    </aside>

    <div class="main-content">
      <header class="content-topbar">
        <h2 id="welcome-msg"></h2>
      </header>

      <section class="balance-card">
        <p class="label">Total Balance</p>
        <div class="balance-row">
          <h2 id="total-balance">GHS 0.00</h2>
          <button id="toggle-balance" aria-label="Toggle balance visibility">👁️</button>
        </div>
      </section>

      <section class="transactions-section">
        <div class="section-header">
          <h3>Recent Transactions</h3>
          <a href="transactions.html" class="small-btn">View All</a>
        </div>

        <ul id="transaction-list" class="transaction-list"></ul>
      </section>

      <footer class="site-footer">© 2026 EasySafe</footer>
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
