<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasySafe - Login</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-visual">
      <div class="logo-spot">EasySafe</div>
      <div class="tagline">
        <h2>Save with purpose,<br>spend with clarity.</h2>
      </div>
    </div>

    <div class="auth-panel">
      <div class="tabs">
        <button id="show-login" class="tab-btn active">Log in</button>
        <button id="show-signup" class="tab-btn">Create account</button>
      </div>

      <form id="login-form" class="auth-form">
        <h1>Welcome back</h1>
        <p class="subtext">New here? <a href="#" id="link-to-signup">Create an account</a></p>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Log in</button>
        <p id="login-error" class="error"></p>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <h1>Create an account</h1>
        <p class="subtext">Already have an account? <a href="#" id="link-to-login">Log in</a></p>
        <input type="text" id="signup-name" placeholder="Full name" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button type="submit">Create account</button>
        <p id="signup-error" class="error"></p>
      </form>

      <footer class="auth-footer">© 2026 EasySafe</footer>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
